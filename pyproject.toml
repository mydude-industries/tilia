[project]
name = "tilia"
version = "0.2.0"
description = "A private Telegram coach that runs on your own Mac."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "phonenumbers",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tilia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_subprocess: the test may start real processes (bash, git); everything else is blocked",
]
