<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Tilia · candle</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="candle.css?v=11">
<link rel="stylesheet" href="candle-follow.css?v=8">
</head>
<body>
<main id="main">
  <div class="room" aria-hidden="true"><i class="glow"></i><i class="grain"></i></div>
  <div class="head" id="head">
    <p class="kicker" id="kicker">A small ritual</p>
    <h1 id="title">What's this candle for?</h1>
    <p class="lead" id="lead">A few words, if you like. Then light it, and come back to blow it out when it's done.</p>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <p class="sr" id="after" aria-live="polite"></p>

  <div class="candle" id="candle" role="button" aria-label="The candle">
    <div class="halo" aria-hidden="true"></div>
    <div class="flame" id="flame"></div>
    <div class="wick"></div>
    <div class="wax"><div class="rim"></div><div class="drip"></div><div class="drip two"></div></div>
  </div>

  <p class="say" id="say"></p>
  <form class="ask" id="ask" autocomplete="off" hidden>
    <div class="ask-line">
      <input class="ask-field" id="field" type="text" maxlength="60" enterkeyhint="go"
        autocapitalize="sentences" placeholder="The call, the talk, the day…" aria-label="What's this candle for?">
    </div>
    <button type="submit" class="tap go" id="light">Light it</button>
    <button type="button" class="ask-skip" id="skip">Skip, just light it</button>
  </form>
  <p class="quiet" id="hint"></p>
  <div class="meter" id="meter" hidden><i id="bar"></i></div>

  <button type="button" class="tap go" id="mic" hidden>Blow it out with the microphone</button>
  <div class="follow" id="follow" hidden></div>
  <button type="button" class="tap" id="again" hidden>Light it again</button>
  <button type="button" class="tap go" id="done" hidden>Done</button>
  <button type="button" class="tap go" id="resend" hidden>Send it again</button>

  <p class="note">The microphone only listens for your breath, here on the phone. Nothing is recorded or sent anywhere.</p>
</main>
<script src="vendor/telegram-web-app.js"></script>
<script src="candle-core.js?v=11"></script>
<script src="candle-flame.js?v=10"></script>
<script src="candle-smoke.js?v=11"></script>
<script src="candle-follow.js?v=8"></script>
<script src="candle.js?v=11"></script>
</body>
</html>
